description: Effa is a sustainable consumer goods company that makes the world's first 100%
  recyclable paper toothbrush, a disposable, plastic-free alternative to conventional plastic
  toothbrushes aimed at hotels, airlines, and retail consumers. Founded in Ukraine by Dasha
  and Ilya Kichuk and headquartered in San Francisco, California, the company supplies
  eco-friendly personal care and amenity products to hospitality and travel clients, with
  reported customers including Netflix and Radisson. Effa is backed by 500 Global and Startup
  Wise Guys. Effa does not currently publish a public API, developer portal, or machine-readable
  API specification; this profile tracks the company for the API Evangelist network.
